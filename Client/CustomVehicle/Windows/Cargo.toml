[package]
name = "custom-vehicle-windows"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "custom_vehicle_windows"
crate-type = ["cdylib", "rlib"]

[dependencies]
samp-client-sdk = { git = "https://github.com/Akionka/rak-samp", rev = "c658b939a3d5b5be512b5b27ea869995bc37b44d", package = "samp-client-sdk" }
modkit-abi = { git = "https://github.com/Akionka/rak-samp", rev = "c658b939a3d5b5be512b5b27ea869995bc37b44d", package = "modkit-abi" }
modkit-sdk = { git = "https://github.com/Akionka/rak-samp", rev = "c658b939a3d5b5be512b5b27ea869995bc37b44d", package = "modkit-sdk" }
ureq = { version = "=2.12.1" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }

[profile.release]
lto = true
codegen-units = 1
